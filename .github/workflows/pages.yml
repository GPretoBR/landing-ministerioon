name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Em domínio próprio: defina a variável de repositório SITE_URL e deixe BASE_PATH vazio.
      NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH || '/landing-ministerioon' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://gpretobr.github.io/landing-ministerioon' }}
      NEXT_PUBLIC_GTM_ID: ${{ vars.GTM_ID }}
      NEXT_PUBLIC_GA4_ID: ${{ vars.GA4_ID }}
      NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.META_PIXEL_ID }}
      NEXT_PUBLIC_CLARITY_ID: ${{ vars.CLARITY_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
